<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>TrayBin</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="./app.js" defer></script>
</head>
<body>
<main class="app" id="app">
  <header class="bar">
    <div class="brand">
      <span class="brand-symbol" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 7h15M9 4.5h6M6.5 7l1 13h9l1-13M10 10.5v6M14 10.5v6"/></svg></span>
      <div class="brand-name">TrayBin <span class="brand-version">2.1.1</span></div>
    </div>
    <div class="bar-right"><span id="dot" class="status-dot" aria-hidden="true" title="Проверка Windows"></span><button id="hide" class="icon-button" type="button" aria-label="Скрыть панель" title="Скрыть (Esc)">×</button></div>
  </header>

  <div class="view-area">
    <div class="home" id="home-view">
  <section class="hero" aria-labelledby="hero-title">
    <div class="hero-top"><span class="eyebrow">КОРЗИНА WINDOWS</span><span class="checked" id="checked">Проверка…</span></div>
    <h1 class="state-label" id="hero-title">Проверка состояния</h1>
    <div class="big-count"><span id="count">—</span><span class="count-unit" id="count-unit"></span></div>
    <p id="used" class="hero-note">Получение данных Windows…</p>
  </section>

  <section class="actions" aria-label="Действия с корзиной">
    <button id="open" class="action primary" type="button" disabled>
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12V5h14v14H5v-4M10 14l4-4m-4 0h4v4"/></svg>
      <span>Открыть корзину</span>
    </button>
    <button id="empty" class="action secondary" type="button" disabled title="Подтверждение очистки появится в Windows">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M9 4h6M7 7l1 13h8l1-13M10 10.5v6m4-6v6"/></svg>
      <span>Очистить корзину</span>
    </button>
  </section>

  <section class="setting-group" aria-label="Настройки">
    <button id="startup" class="setting" type="button" disabled aria-pressed="false">
      <span class="setting-copy"><strong>Автозапуск</strong><small id="startup-status">Проверка…</small></span>
      <span id="switch" class="toggle" aria-hidden="true"><i></i></span>
    </button>
  </section>
    </div>

    <section class="details" id="details-panel" hidden aria-label="Подробности о корзине">
      <div class="details-heading">Статистика корзины</div>
      <div class="metrics">
        <div><span>Занято</span><strong id="used-value">—</strong></div>
        <div><span id="limit-label">Лимит Windows</span><strong id="limit-value">—</strong></div>
      </div>
      <div class="capacity-line"><span id="capacity-caption">Заполненность корзины</span><strong id="percent">—</strong></div>
      <div class="track" id="track" role="progressbar" aria-label="Заполненность корзины" aria-valuemin="0" aria-valuemax="100" aria-valuetext="Нет данных"><div class="fill" id="fill"></div></div>
      <div class="details-heading drive-heading">По дискам</div>
      <div id="volumes" class="volumes" role="list" aria-label="Использование корзины по дискам">Нет данных</div>
    </section>
  </div>

  <footer class="bottom-line">
    <button id="details" class="text-button" type="button" aria-expanded="false" aria-controls="details-panel">Подробнее</button>
    <button id="quit" class="text-button quit" type="button">Выйти из TrayBin</button>
  </footer>

  <div id="toast" role="status" aria-live="polite"></div>
</main>
</body>
</html>
